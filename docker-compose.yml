services:
  postgres:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowforge}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - flowforge-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowforge} -d ${POSTGRES_DB:-flowforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowforge-pgdata:
